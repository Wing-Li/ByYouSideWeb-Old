# 配置需修改的：
# 1. 端口号
# 2. 数据库账号、密码
# 3. 图片域名
#
#
# 自定义配置：https://www.jianshu.com/p/6df290d48b64
com.lyl.title=伴你左右
com.lyl.description=伴你左右App接口
com.lyl.baseUrl=http://lyl.com
com.lyl.imageHost=http://pdt0nxb6n.bkt.clouddn.com/
#
#
# 嵌入式服务器配置 (ServerProperties)
server.port=8020
# server.tomcat.uri-encoding=UTF-8
# server.tomcat.basedir=target/tomcat
#
#
# 数据库
# 实现h2数据库本地化：http://412887952-qq-com.iteye.com/blog/2322756
# 指定一个绝对的路径:使用~标明位置; "~"这个符号代表的就是当前登录到操作系统的用户对应的用户目录； . 代表当前目录
spring.datasource.url=jdbc:h2:file:./ByYourSide/config/db/.h2/side_db
spring.datasource.username=admin
spring.datasource.password=2530513
spring.datasource.driverClassName=org.h2.Driver
# 进行该配置，你就可以通过YOUR_URL/h2-console
spring.h2.console.path=/h2-bnzy-db
# 进行该配置后，h2 web consloe就可以在远程访问了。否则只能在本机访问。
spring.h2.console.settings.web-allow-others=true
spring.h2.console.enabled=true
#
# 项目重新启动之后，使数据依然存在，需加这个配置
spring.jpa.hibernate.ddl-auto=update
#
# 显示SQL语句
spring.jpa.show-sql=true